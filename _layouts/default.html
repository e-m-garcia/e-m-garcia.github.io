<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f5">
    <title>{% if page.browser_title %}{{ page.browser_title }}{% else %}{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
    <script>
      try {
        if (localStorage.getItem("color-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (error) {}
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script defer src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

    {% if page.math %}
      <script>
        window.MathJax = {
          tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true
          },
          options: {
            skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
          }
        };
      </script>
      <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="shell site-header__inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="wordmark__name">{{ site.title }}</span>
        </a>
        <div class="site-controls">
          <nav class="site-nav" aria-label="Primary navigation">
            <a{% if page.url == "/" %} class="is-current"{% endif %} href="{{ '/' | relative_url }}">Home</a>
            <a{% if page.url contains "/research" %} class="is-current"{% endif %} href="{{ '/research/' | relative_url }}">Research</a>
            <a{% if page.url contains "/blog" %} class="is-current"{% endif %} href="{{ '/blog/' | relative_url }}">Blog</a>
          </nav>
          <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Use dark mode" data-theme-toggle>
            <span class="theme-toggle__thumb" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content" class="shell">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell site-footer__inner">
        <p>Questions, collaborations, or thoughtful disagreements are welcome.</p>
        <div class="link-row">
          <a href="mailto:{{ site.email }}">{{ site.email }}</a>
          <span aria-hidden="true">·</span>
          <a href="https://github.com/{{ site.github_username }}">GitHub</a>
        </div>
        <p class="site-footer__fine">© {{ "now" | date: "%Y" }} Ethan Garcia</p>
      </div>
    </footer>
  </body>
</html>
