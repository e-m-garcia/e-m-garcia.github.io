---
layout: default
---

<article class="research-article">
  <header class="article-header">
    <a class="back-link" href="{{ '/blog/' | relative_url }}"><span aria-hidden="true">←</span> Blog</a>
    <p class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="article-header__lede">{{ page.description }}</p>{% endif %}
  </header>
  <div class="article-rule" aria-hidden="true"></div>
  <div class="prose prose--article prose--centered">
    {{ content }}
  </div>
</article>
